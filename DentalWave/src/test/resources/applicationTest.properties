spring.application.name=AssistantScheduler

spring.datasource.url=jdbc:postgresql://localhost:5432/YOUR_TEST_DATABASE_NAME
spring.datasource.username=YOUR_TEST_DATABASE_USERNAME
spring.datasource.password=YOUR_TEST_DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt-secret=YOUR_TEST_BASE64_256_BIT_JWT_SECRET
app.jwt-expiration-milliseconds=604800000

app.admin-user-username=admin
app.admin-user-password=YOUR_TEST_ADMIN_PASSWORD

app.manager-user-username=manager
app.manager-user-password=YOUR_TEST_MANAGER_PASSWORD

app.hr-user-username=hr
app.hr-user-password=YOUR_TEST_HR_PASSWORD

app.assistant-user-username=assistant
app.assistant-user-password=YOUR_TEST_ASSISTANT_PASSWORD
