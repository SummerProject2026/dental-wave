spring.application.name=AssistantScheduler

# Local overrides are read from disk during development and remain excluded from packaged artifacts.
# The config/ path is also supported for a future portable launcher beside the packaged JAR.
spring.config.import=optional:file:./src/main/resources/application-local.properties,optional:file:./config/application-local.properties

# Safe defaults for shared source control. Override these locally.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistantscheduler}
spring.datasource.username=${DB_USERNAME:CHANGE_ME}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt-secret=${JWT_SECRET:}
app.jwt-expiration-milliseconds=${JWT_EXPIRATION_MS:604800000}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed-data=${SEED_DATA:false}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
