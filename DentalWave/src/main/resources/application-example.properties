# Copy this file to application-local.properties for local development.
# application-local.properties is ignored by Git and excluded from packaged JARs.
spring.datasource.url=jdbc:postgresql://localhost:5432/dentalwave
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD

# Must be Base64 and decode to at least 32 bytes.
app.jwt-secret=YOUR_BASE64_JWT_SECRET
app.jwt-expiration-milliseconds=604800000

# Development only. Never enable this in production.
app.seed-data=true

app.cors-allowed-origins=http://localhost:5173,http://localhost:5174

spring.mail.username=
spring.mail.password=
