spring.application.name=AssistantSchedulerTests

# Keep the complete test suite isolated from developer and production databases.
spring.datasource.url=jdbc:h2:mem:dentalwave-tests;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=MONTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Public, test-only key material. Never use this value outside automated tests.
app.jwt-secret=VGhpcy1pcy1hLXB1YmxpYy10ZXN0LW9ubHktand0LXNlY3JldC0zMi1ieXRlcyE=
app.jwt-expiration-milliseconds=60000
app.cors-allowed-origins=http://localhost:5173
app.seed-data=false
spring.mail.host=localhost

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
