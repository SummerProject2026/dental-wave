spring.datasource.url=jdbc:h2:file:${DENTALWAVE_DATA_PATH:./data/dentalwave};DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE;NON_KEYWORDS=MONTH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.seed-data=false
app.portable-bootstrap=true
app.portable-data-path=${DENTALWAVE_PORTABLE_DATA_PATH:./data}
app.portable-manager-username=${PORTABLE_MANAGER_USERNAME:user}
app.portable-manager-password=${PORTABLE_MANAGER_PASSWORD:}
app.portable-control-token=${PORTABLE_CONTROL_TOKEN:}
app.jwt-secret=${JWT_SECRET}
app.cors-allowed-origins=http://127.0.0.1:8080,http://localhost:8080
server.address=127.0.0.1
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.web.resources.cache.cachecontrol.no-store=true
logging.file.name=./logs/dentalwave.log
